name: postvision

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    image: postvision-api:local
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/postvision_demo
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env antes de iniciar}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FILES_API_URL: ${DOCKER_FILES_API_URL:-http://host.docker.internal:3002}
      FILES_API_KEY: ${FILES_API_KEY:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo:
        condition: service_healthy

  seed:
    image: postvision-api:local
    build: .
    init: true
    profiles: ["tools"]
    command: ["node", "scripts/seed.js"]
    environment:
      NODE_ENV: development
      TZ: America/Sao_Paulo
      MONGODB_URI: mongodb://mongo:27017/postvision_demo
      SEED_ENABLED: "true"
      SEED_PASSWORD: ${SEED_PASSWORD:-PostVision123!}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
